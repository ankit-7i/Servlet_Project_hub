<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bank Registration</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: #ffffff;
        width: 420px;
        padding: 40px 35px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    .title {
        font-size: 28px;
        font-weight: 600;
        color: #1e3c72;
        text-align: center;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    .input-group {
        margin-bottom: 22px;
    }

    .input-group input {
        width: 100%;
        padding: 14px 15px;
        font-size: 16px;
        border-radius: 10px;
        border: 1.8px solid #a0a0a0;
        outline: none;
        background-color: #f8f8f8;
        transition: 0.3s ease;
    }

    .input-group input:focus {
        border-color: #1e3c72;
        box-shadow: 0 0 8px rgba(30, 60, 114, 0.5);
        background-color: #fff;
    }

    .btn {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        transition: 0.3s ease;
        letter-spacing: 1px;
    }

    .btn:hover {
        background: linear-gradient(135deg, #284a8f, #3b6cc8);
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .btn:active {
        transform: scale(0.95);
    }

    .error {
        color: #c62828;
        font-size: 13px;
        margin-top: -17px;
        margin-bottom: 18px;
        padding-left: 3px;
    }
</style>

<script>
function validatePassword() {
    const pwd = document.getElementById("pwd").value;
    const err = document.getElementById("error");

    const upper = /[A-Z]/;
    const lower = /[a-z]/;
    const num = /[0-9]/;
    const special = /[@#$%^&*!]/;

    if (pwd.length > 10) {
        err.innerHTML = "❌ Maximum length is 10 characters";
        return false;
    }
    if (!upper.test(pwd)) {
        err.innerHTML = "❌ Must include at least one uppercase letter";
        return false;
    }
    if (!lower.test(pwd)) {
        err.innerHTML = "❌ Must include at least one lowercase letter";
        return false;
    }
    if (!num.test(pwd)) {
        err.innerHTML = "❌ Must include at least one number";
        return false;
    }
    if (!special.test(pwd)) {
        err.innerHTML = "❌ Must include at least one special character (@#$%^&*! etc.)";
        return false;
    }

    err.innerHTML = "";
    return true;
}
</script>

</head>
<body>

<div class="card">

    <div class="title">Bank Registration</div>

    <form action="signup" method="post" onsubmit="return validatePassword()">

        <div class="input-group">
            <input type="text" name="cname" placeholder="Account Holder Name" required>
        </div>

        <div class="input-group">
            <input type="text" name="acnum" placeholder="Account Number" required>
        </div>

        <div class="input-group">
            <input type="text" name="bal" placeholder="Balance" required>
        </div>

        <div class="input-group">
            <input type="text" name="cnum" placeholder="Debit Card Number" required>
        </div>

        <div class="input-group">
            <input type="date" name="dob" required>
        </div>

        <div class="input-group">
            <input type="password" id="pwd" name="pass" placeholder="Password" onkeyup="validatePassword()" required>
        </div>

        <div id="error" class="error"></div>

        <button type="submit" class="btn">Register</button>

    </form>

</div>

</body>
</html>
