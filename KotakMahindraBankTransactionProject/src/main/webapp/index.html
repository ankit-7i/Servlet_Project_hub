<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kotak Mahindra Bank</title>

<style>
    /* Gradient Background */
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff4b2b, #ff416c);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Center Box */
    .container {
        background: #ffffff;
        padding: 40px 60px;
        border-radius: 15px;
        border: 3px solid #cc0033;
        box-shadow: 0 0 30px rgba(0,0,0,0.3);
        text-align: center;
    }

    .container h1 {
        margin: 0;
        color: #cc0033;
        font-size: 32px;
        font-weight: bold;
    }

    .container p {
        margin-top: 10px;
        font-size: 18px;
        color: #333;
    }

    /* Stylish Buttons */
    button {
        width: 200px;
        padding: 12px 18px;
        font-size: 18px;
        margin: 15px 0;
        border: none;
        border-radius: 8px;
        background-color: #cc0033;
        color: white;
        cursor: pointer;
        transition: transform 0.2s ease, background-color 0.2s ease;
    }

    button:hover {
        background-color: #e6004c;
        transform: scale(1.05);
    }

    /* Press Animation */
    button:active {
        transform: scale(0.92);
    }

    /* For clickable links inside button */
    button a {
        color: white;
        text-decoration: none;
        display: block;
    }
</style>

</head>
<body>

<div class="container">
    <h1><u>Welcome to Kotak Mahindra Bank</u></h1>
    <p>Let's Make Banking Easy and Handy</p>
    
    <button><a href="Login.html">User Login</a></button><br>
    <button><a href="Signup.html">Sign Up</a></button>
</div>

</body>
</html>
